apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-streamable-http
  labels:
    app: mcp-server-streamable-http
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-server-streamable-http
  template:
    metadata:
      labels:
        app: mcp-server-streamable-http
    spec:
      containers:
      - name: mcp-server
        image: mcp-server-streamable-http:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
